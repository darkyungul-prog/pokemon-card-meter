plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pokemoncardmeter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pokemoncardmeter.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5-camera-fix'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
